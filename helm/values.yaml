replicaCount: 1

image:
  repository: your-registry/vue-skeleton
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

containerPort: 8080

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: vue-skeleton.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  NG_PORT: "8080"
  NG_API_UPSTREAM: "http://your-api-service.default.svc.cluster.local:8080"
  NG_AUTH_UPSTREAM: "http://your-auth-service.default.svc.cluster.local:8080"
  APP_APP_TITLE: "Vue Skeleton"
  APP_API_BASE_URL: "/api"
  APP_ENABLE_ROUTE_GUARD: "true"
  APP_DEFAULT_ROUTE: "/"
  APP_FEATURE_FLAGS__SHOW_ABOUT: "true"
  APP_VUETIFY__DEFAULT_THEME: "light"

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
