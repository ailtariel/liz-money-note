# Basic connection settings
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $proxy_host;

# Forward real client information
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Optionally inject user/tenant info from the auth subrequest
proxy_set_header X-User-Id $upstream_http_x_user_id;
proxy_set_header X-Tenant  $upstream_http_x_tenant;

# SSE-specific: disable all caching and buffering
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;

# Ensure no intermediate buffering (required for real-time streaming)
add_header X-Accel-Buffering "no" always;
add_header Cache-Control "no-cache" always;

# Long timeouts for persistent SSE connections
proxy_read_timeout  3600s;
proxy_send_timeout  3600s;
send_timeout        3600s;

# Explicitly accept SSE content type
# proxy_set_header Accept "text/event-stream";

# Disable gzip compression to avoid delayed event delivery
gzip off;