<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/static/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/static/icons/app-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Liz Money Note</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.__APP_CONFIG_READY__ = (async () => {
        try {
          const response = await fetch(
            `/config/env-config.json?v=${Date.now()}`,
            {
              cache: 'no-store'
            }
          );

          const runtimeEnv = response.ok ? await response.json() : {};
          sessionStorage.setItem(
            '__APP_RUNTIME_ENV__',
            JSON.stringify(runtimeEnv)
          );
        } catch {
          sessionStorage.removeItem('__APP_RUNTIME_ENV__');
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
